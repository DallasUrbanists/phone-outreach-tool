<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phone Outreach Tool</title>

    <!-- Bootstrap 5 CSS & Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom App Styles (Layout & Gesture Overrides) -->
    <link rel="stylesheet" href="./styles/app.css">
</head>

<body class="bg-body-secondary">

    <div class="app-container card shadow border-0 mx-auto">

        <!-- Header & Step Indicator -->
        <header class="card-header bg-dark text-white p-3 d-flex align-items-center justify-content-between flex-shrink-0 border-0 flex-wrap">
            <div>
                <h1 class="h6 fw-bold mb-0 text-white">Phone Outreach Tool</h1>
                <small class="text-secondary" id="step-subtitle">Step 1: Upload CSV or Excel Data</small>
            </div>
            <!-- Wizard Step Pills (4 Steps) -->
            <div class="d-flex align-items-center gap-1" id="step-pills">
                <span class="badge rounded-pill bg-success text-white step-pill" id="pill-1">1</span>
                <span class="step-connector bg-secondary" id="line-1"></span>
                <span class="badge rounded-pill bg-secondary text-white-50 step-pill" id="pill-2">2</span>
                <span class="step-connector bg-secondary" id="line-2"></span>
                <span class="badge rounded-pill bg-secondary text-white-50 step-pill" id="pill-3">3</span>
                <span class="step-connector bg-secondary" id="line-3"></span>
                <span class="badge rounded-pill bg-secondary text-white-50 step-pill" id="pill-4">4</span>
            </div>
        </header>

        <!-- Dynamic Content Body -->
        <main class="card-body p-3 overflow-y-auto flex-grow-1 custom-scroll d-flex flex-column justify-content-between" id="main-content">

            <!-- STEP 1: Upload CSV Data -->
            <section id="step-1" class="step-panel flex-grow-1">
                <div class="d-flex flex-column gap-3">
                    <!-- File Drop/Select Target -->
                    <div class="card border-2 border-dashed bg-light text-center p-4 rounded-3 cursor-pointer dropzone" id="drop-zone" onclick="document.getElementById('csv-file-input').click()">
                        <i class="bi bi-cloud-arrow-up text-secondary display-5 mb-2"></i>
                        <span class="fw-semibold text-secondary small" id="file-name-display">Select a CSV or Excel contact list from your phone or device to generate custom SMS links.</span>
                        <span class="text-muted small mt-1" id="file-size-display"></span>
                        <input type="file" id="csv-file-input" accept=".csv,text/csv,text/plain,.xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" class="d-none">
                    </div>

                    <!-- Manual Input Textarea -->
                    <div>
                        <label class="form-label fw-semibold small text-secondary mb-1" for="manual-contacts-input">Or enter contact list manually</label>
                        <textarea id="manual-contacts-input" class="form-control auto-resize h-scroll rounded-0 rounded-top" rows="4"
                            placeholder="Paste CSV data or plain phone numbers..." oninput="updateStep1NextButton()" spellcheck="false"></textarea>
                        <!-- Input Format Radio Group -->
                        <div class="bg-light border rounded-bottom p-2 d-flex flex-column gap-2">
                            <div class="form-check mb-0">
                                <input class="form-check-input cursor-pointer" type="radio" name="inputFormatMode" id="mode-row-per-contact" value="row-per-contact" checked onchange="handleInputModeChange()">
                                <label class="form-check-label small fw-semibold text-dark cursor-pointer" for="mode-row-per-contact">
                                    One row per contact
                                </label>
                            </div>
                            <div class="form-check mb-0">
                                <input class="form-check-input cursor-pointer" type="radio" name="inputFormatMode" id="mode-plain-phone-list" value="plain-phone-list" onchange="handleInputModeChange()">
                                <label class="form-check-label small fw-semibold text-dark cursor-pointer" for="mode-plain-phone-list">
                                    Plain list of phone numbers
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Step 1 Actions (Only visible when file selected or text entered) -->
                <div id="step-1-actions" class="pt-3 d-none">
                    <div class="row g-2">
                        <div class="col-4">
                            <button type="button" id="btn-step-1-reset" onclick="resetStep1Inputs()" class="btn btn-outline-secondary w-100">
                                Reset
                            </button>
                        </div>
                        <div class="col-8">
                            <button type="button" id="btn-step-1-next" onclick="handleStep1Continue()" class="btn btn-success w-100 d-flex align-items-center justify-content-center gap-2">
                                <span id="btn-step-1-next-text">Continue to column mapping</span>
                                <i class="bi bi-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- STEP 2: Map Columns -->
            <section id="step-2" class="step-panel flex-grow-1 d-none">
                <div class="d-flex flex-column gap-2">

                    <div class="d-flex align-items-center rounded-3 mb-1 gap-2">
                        <span class="small fw-semibold text-secondary">Detected columns:</span>
                        <span id="detected-column-count" class="badge bg-dark">0</span>
                    </div>

                    <!-- First row is header row toggle -->
                    <div class="form-check form-switch bg-light border rounded-3 p-2 gap-2 d-flex align-items-center m-0">
                        <input type="checkbox" id="header-row-checkbox" class="form-check-input ms-0 mt-0" onchange="handleHeaderRowToggle()">
                        <label class="form-check-label fw-semibold small text-dark mb-0 cursor-pointer" for="header-row-checkbox">
                            First row is header row
                        </label>
                    </div>

                    <!-- Mapping Selectors -->
                    <div>
                        <label class="form-label fw-semibold small text-secondary mb-1">Name Column(s)</label>
                        <div class="row g-2" id="name-mapping-container">
                            <div class="col-6">
                                <select id="map-first-name" class="form-select form-select-sm" onchange="validateStep2()">
                                    <option value="">-- First / Full Name --</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <select id="map-last-name" class="form-select form-select-sm" onchange="validateStep2()">
                                    <option value="">-- Last Name (Optional) --</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="form-label fw-semibold small text-secondary mb-1">Phone Number Column <span class="text-danger">*</span></label>
                        <select id="map-phone" class="form-select form-select-sm" onchange="validateStep2()">
                            <option value="">-- Select Phone Column --</option>
                        </select>
                    </div>

                    <div>
                        <label class="form-label fw-semibold small text-secondary mb-1">Email Column (Optional)</label>
                        <select id="map-email" class="form-select form-select-sm" onchange="validateStep2()">
                            <option value="">-- Select Email Column --</option>
                        </select>
                    </div>
                </div>

                <!-- Step 2 Actions -->
                <div class="pt-3">
                    <div class="row g-2">
                        <div class="col-4">
                            <button type="button" onclick="goToStep(1)" class="btn btn-outline-secondary w-100">
                                Back
                            </button>
                        </div>
                        <div class="col-8">
                            <button type="button" id="btn-process-contacts" onclick="processAndNormalizeData()" class="btn btn-success w-100 d-flex align-items-center justify-content-center gap-2" disabled>
                                <span>Process contacts</span>
                                <i class="bi bi-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- STEP 3: Message Template -->
            <section id="step-3" class="step-panel flex-grow-1 d-none">
                <div class="d-flex flex-column gap-2">
                    <div>
                        <label class="form-label fw-semibold small text-secondary mb-1" for="message-template-input">Message Template</label>
                        <textarea id="message-template-input" class="form-control mb-3 auto-resize"
                            placeholder="Write your SMS message..." oninput="updateTemplatePreview()"></textarea>

                        <!-- Variable Insert Pills -->
                        <div class="mt-2" id="variable-tags-container">
                            <div class="text-uppercase small fw-bold text-muted mb-1" style="font-size: 0.7rem; letter-spacing: 0.05em;">Insert Variable Tag</div>
                            <div class="d-flex flex-wrap gap-1">
                                <button type="button" class="btn btn-sm btn-outline-success rounded-pill px-2 py-0 font-monospace" style="font-size: 0.75rem;" onclick="insertTemplateVariable('{first_name}')">{first_name}</button>
                                <button type="button" class="btn btn-sm btn-outline-success rounded-pill px-2 py-0 font-monospace" style="font-size: 0.75rem;" onclick="insertTemplateVariable('{last_name}')">{last_name}</button>
                                <button type="button" class="btn btn-sm btn-outline-success rounded-pill px-2 py-0 font-monospace" style="font-size: 0.75rem;" onclick="insertTemplateVariable('{full_name}')">{full_name}</button>
                                <button type="button" class="btn btn-sm btn-outline-success rounded-pill px-2 py-0 font-monospace" style="font-size: 0.75rem;" onclick="insertTemplateVariable('{email}')">{email}</button>
                            </div>
                        </div>

                        <!-- Live Preview Card -->
                        <div class="card bg-light border rounded-3 p-3 mt-3">
                            <div class="text-uppercase small fw-bold text-muted mb-1" style="font-size: 0.7rem; letter-spacing: 0.05em;">Preview first contact</div>
                            <div class="small text-dark text-break" id="template-preview-text" style="white-space: pre-wrap;"></div>
                        </div>
                    </div>
                </div>

                <!-- Step 3 Actions -->
                <div class="pt-3">
                    <div class="row g-2">
                        <div class="col-4">
                            <button type="button" onclick="handleStep3Back()" class="btn btn-outline-secondary w-100">
                                Back
                            </button>
                        </div>
                        <div class="col-8">
                            <button type="button" onclick="goToStep(4)" class="btn btn-success w-100 d-flex align-items-center justify-content-center gap-2">
                                <span>Continue to list</span>
                                <i class="bi bi-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- STEP 4: Outreach List (Swipe, Select, Copy) -->
            <section id="step-4" class="step-panel flex-grow-1 d-none" style="min-height: 0;">
                <!-- Summary / Counter bar -->
                <div id="step-4-progress" class="text-white mb-3 shadow-sm flex-shrink-0 border-0">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <span class="text-uppercase small fw-bold text-secondary" style="font-size: 0.7rem; letter-spacing: 0.05em;">Progress</span>
                        <span class="fw-bold text-success small" id="progress-text">0 / 0 Contacted</span>
                    </div>
                    <div class="progress" style="height: 12px;" role="progressbar" aria-label="Outreach Progress">
                        <div id="progress-bar" class="progress-bar bg-success" style="width: 0%;"></div>
                    </div>
                </div>

                <!-- Search and Filter Bar -->
                <div id="step-4-search-filter" class="d-flex align-items-center gap-2 mb-2 flex-shrink-0">
                    <!-- Toggle Select All Button -->
                    <button type="button" id="btn-toggle-select-all" onclick="toggleSelectAllContacts()" class="btn btn-sm btn-outline-secondary d-flex align-items-center justify-content-center" style="width: 34px; height: 34px;" title="Toggle Select All">
                        <i class="bi bi-check2-square fs-6"></i>
                    </button>

                    <div class="input-group input-group-sm flex-grow-1">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-search"></i></span>
                        <input type="text" id="contact-search" oninput="filterContacts()"
                            placeholder="Search name or phone..."
                            class="form-control border-start-0 bg-light ps-0">
                    </div>

                    <!-- Restore Ignored Button (Only visible when ignored > 0) -->
                    <button type="button" id="btn-restore-ignored" onclick="restoreIgnoredContacts()" class="btn btn-sm btn-outline-danger d-none align-items-center gap-1 text-nowrap" title="Restore Ignored Contacts">
                        <i class="bi bi-arrow-counterclockwise"></i>
                        <span>Restore (<span id="ignored-count-display">0</span>)</span>
                    </button>

                    <button type="button" onclick="toggleFilterSent()" id="btn-filter-sent" class="btn btn-sm btn-outline-secondary">
                        All
                    </button>
                </div>

                <!-- Contacts Table Container -->
                <div id="step-4-contacts-container" class="card border rounded-3 overflow-hidden flex-grow-1 d-flex flex-column mb-2 bg-white" style="min-height: 0;">
                    <div id="contacts-scroll-container" class="overflow-y-auto custom-scroll flex-grow-1">
                        <div id="contacts-list" class="list-group list-group-flush"></div>
                    </div>
                </div>

                <!-- Step 4 Footer Controls -->
                <div id="step-4-footer" class="pt-1 flex-shrink-0">
                    <div class="d-flex align-items-center gap-2 position-relative">
                        <button type="button" onclick="goToStep(3)" class="btn btn-outline-secondary btn-sm">
                            Back
                        </button>
                        <!-- Copy Selected Button (Only visible when selected >= 1) -->
                        <button type="button" id="btn-copy-selected" onclick="copySelectedEmails()" class="btn btn-primary btn-sm d-none align-items-center gap-1">
                            <i class="bi bi-clipboard"></i>
                            <span>Copy selected (<span id="selected-count-display">0</span>)</span>
                        </button>
                        <button type="button" onclick="resetProgress()" class="btn btn-outline-dark btn-sm flex-grow-1">
                            Reset checkmarks
                        </button>
                        <button type="button" onclick="startOver()" class="btn btn-outline-danger btn-sm">
                            Start over
                        </button>
                        <button type="button" id="btn-toggle-expand" onclick="toggleExpandContactList()" class="btn btn-outline-secondary btn-sm d-flex align-items-center justify-content-center flex-shrink-0" title="Expand list" aria-label="Expand contact list">
                            <i class="bi bi-arrows-fullscreen"></i>
                        </button>
                        <div id="expand-tooltip" class="expand-tooltip d-none" role="tooltip">
                            <span>Click to expand list fullscreen</span>
                            <div class="expand-tooltip-arrow"></div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- Toast Notifications Container -->
        <div id="toast-container" class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3" style="z-index: 1090;" aria-live="polite"></div>
    </div>

    <!-- SheetJS (Excel .xlsx / .xls support) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./app.js"></script>

</body>

</html>
