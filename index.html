<!DOCTYPE html>

<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMS Outreach Wizard</title>
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/app.css" />
</head>

<body>

    <div class="app-container">

        <!-- Header & Step Indicator -->
        <header class="app-header">
            <div>
                <h1 class="app-header-title">Dallas Urbanists</h1>
                <p class="app-header-subtitle" id="step-subtitle">Step 1: Upload CSV Data</p>
            </div>
            <!-- Wizard Step Pills -->
            <div class="wizard-steps" id="step-pills">
                <span class="step-pill step-pill--active" id="pill-1">1</span>
                <span class="step-connector" id="line-1"></span>
                <span class="step-pill step-pill--inactive" id="pill-2">2</span>
                <span class="step-connector" id="line-2"></span>
                <span class="step-pill step-pill--inactive" id="pill-3">3</span>
            </div>
        </header>

        <!-- Dynamic Content Body -->
        <main class="app-main custom-scroll" id="main-content">

            <section id="step-1" class="step-panel">
                <div class="step-panel-body">
                    <!-- File Drop/Select Target -->
                    <div class="dropzone" id="drop-zone" onclick="document.getElementById('csv-file-input').click()">
                        <svg class="dropzone-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                            </path>
                        </svg>
                        <span class="dropzone-label" id="file-name-display">Select a CSV contact list from your phone or device to
                            generate custom SMS links.</span>
                        <span class="dropzone-subtext" id="file-size-display"></span>
                        <input type="file" id="csv-file-input" accept=".csv,text/csv" class="file-input-hidden">
                    </div>
                </div>

                <!-- Step 1 Actions -->
                <div class="step-panel-footer">
                    <button id="btn-step-1-next" onclick="goToStep(2)" class="btn btn-primary btn-full">
                        <span>Continue to column mapping</span>
                        <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                        </svg>
                    </button>
                </div>
            </section>

            <section id="step-2" class="step-panel hidden">
                <div class="step-panel-body">
                    <div class="info-banner">
                        <span class="info-banner-label">Detected Columns:</span>
                        <span id="detected-column-count" class="info-banner-value">7</span>
                    </div>

                    <!-- Mapping Selectors -->
                    <div class="form-group">
                        <label class="form-label">Name Column(s)</label>
                        <div class="form-grid-2" id="name-mapping-container">
                            <select id="map-first-name" class="form-select">
                                <option value="">-- First / Full Name --</option>
                                <option value="0">Name:</option>
                                <option value="1">Email:</option>
                                <option value="2">Number:</option>
                                <option value="3">Neighborhood:</option>
                                <option value="4">Affilitations:</option>
                                <option value="5">Date:</option>
                                <option value="6"></option>
                            </select>
                            <select id="map-last-name" class="form-select">
                                <option value="">-- Last Name (Optional) --</option>
                                <option value="0">Name:</option>
                                <option value="1">Email:</option>
                                <option value="2">Number:</option>
                                <option value="3">Neighborhood:</option>
                                <option value="4">Affilitations:</option>
                                <option value="5">Date:</option>
                                <option value="6"></option>
                            </select>
                        </div>
                        <p class="form-hint">Select single Full Name or split First/Last columns.</p>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Phone Number Column <span class="form-required">*</span></label>
                        <select id="map-phone" class="form-select">
                            <option value="">-- Select Phone Column --</option>
                            <option value="0">Name:</option>
                            <option value="1">Email:</option>
                            <option value="2">Number:</option>
                            <option value="3">Neighborhood:</option>
                            <option value="4">Affilitations:</option>
                            <option value="5">Date:</option>
                            <option value="6"></option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Email Column (Optional)</label>
                        <select id="map-email" class="form-select">
                            <option value="">-- Select Email Column --</option>
                            <option value="0">Name:</option>
                            <option value="1">Email:</option>
                            <option value="2">Number:</option>
                            <option value="3">Neighborhood:</option>
                            <option value="4">Affilitations:</option>
                            <option value="5">Date:</option>
                            <option value="6"></option>
                        </select>
                    </div>
                </div>

                <!-- Step 2 Actions -->
                <div class="step-panel-footer">
                    <div class="action-grid-split">
                        <button type="button" onclick="goToStep(1)" class="btn btn-secondary btn-full">
                            Back
                        </button>
                        <button type="button" onclick="processAndNormalizeData()" class="btn btn-primary btn-full">
                            <span>Process Contacts</span>
                            <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </section>

            <section id="step-3" class="step-panel hidden">
                <!-- Summary / Counter bar -->
                <div class="progress-card">
                    <div>
                        <div class="progress-label">Progress</div>
                        <div class="progress-value" id="progress-text">1 / 67 Contacted</div>
                    </div>
                    <div class="progress-track">
                        <div id="progress-bar" class="progress-fill" style="width: 1.49254%;"></div>
                    </div>
                </div>

                <!-- Search and Filter Bar -->
                <div class="toolbar">
                    <div class="search-field">
                        <input type="text" id="contact-search" oninput="filterContacts()"
                            placeholder="Search name or phone..."
                            class="search-input">
                        <svg class="search-icon" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                    <button onclick="toggleFilterSent()" id="btn-filter-sent" class="filter-btn">
                        All
                    </button>
                </div>

                <!-- Contacts Table Container -->
                <div class="contacts-card custom-scroll">
                    <div id="contacts-list" class="contacts-list"></div>
                </div>

                <!-- Step 3 Footer Controls -->
                <div class="step-panel-footer">
                    <div class="action-row">
                        <button type="button" onclick="goToStep(2)" class="btn btn-secondary btn-sm">
                            Back
                        </button>
                        <button type="button" onclick="resetProgress()" class="btn btn-dark btn-sm flex-1">
                            Reset Checkmarks
                        </button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // Core State Variables
        let rawCsvHeader = [];
        let rawCsvRows = [];
        let contactMap = new Map(); // Key: normalized phone, Value: { first_name, last_name, email, phone, rawPhone, sent: bool }
        let currentStep = 1;
        let showUnsentOnly = false;

        // Custom Message Template
        const MESSAGE_TEMPLATE = `Hi {first_name}! Tonight the Uptown/Oak Lawn Hyperlocal Conversation will meet at Mike's Chicken at 6:30pm, *not Whole Foods*. Call/text this number for help finding us. RSVP: https://www.meetup.com/dallasurbanists/events/316375035/`;

        // File Input Event Listener
        document.getElementById('csv-file-input').addEventListener('change', handleFileSelect);

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('file-name-display').textContent = file.name;
            document.getElementById('file-size-display').textContent = `${(file.size / 1024).toFixed(1)} KB`;

            const reader = new FileReader();
            reader.onload = function (evt) {
                parseCSVContent(evt.target.result);
            };
            reader.readAsText(file);
        }

        // Custom Robust CSV Parser (Handles quotes, commas, newlines)
        function parseCSVContent(text) {
            const lines = [];
            let row = [];
            let inQuotes = false;
            let currentToken = '';

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];

                if (char === '"') {
                    if (inQuotes && nextChar === '"') {
                        currentToken += '"';
                        i++; // skip escaped quote
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    row.push(currentToken.trim());
                    currentToken = '';
                } else if ((char === '\r' || char === '\n') && !inQuotes) {
                    if (char === '\r' && nextChar === '\n') {
                        i++;
                    }
                    row.push(currentToken.trim());
                    if (row.some(cell => cell !== '')) {
                        lines.push(row);
                    }
                    row = [];
                    currentToken = '';
                } else {
                    currentToken += char;
                }
            }
            if (currentToken || row.length > 0) {
                row.push(currentToken.trim());
                if (row.some(cell => cell !== '')) {
                    lines.push(row);
                }
            }

            if (lines.length < 2) {
                alert('The selected CSV file appears to be empty or missing headers.');
                return;
            }

            rawCsvHeader = lines[0];
            rawCsvRows = lines.slice(1);

            // Enable next button
            const nextBtn = document.getElementById('btn-step-1-next');
            nextBtn.disabled = false;

            populateColumnDropdowns();
        }

        function goToStep(step) {
            console.log("Go to step " + step);
            currentStep = step;

            // Hide all steps
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.add('hidden');
            document.getElementById('step-3').classList.add('hidden');

            // Show target step
            document.getElementById(`step-${step}`).classList.remove('hidden');

            // Update Header UI & Pills
            const subtitles = {
                1: 'Step 1: Upload CSV Data',
                2: 'Step 2: Map Columns',
                3: 'Step 3: Outreach List'
            };
            document.getElementById('step-subtitle').textContent = subtitles[step];

            for (let i = 1; i <= 3; i++) {
                const pill = document.getElementById(`pill-${i}`);
                pill.className = `step-pill ${i <= step ? 'step-pill--active' : 'step-pill--inactive'}`;
            }
        }

        function populateColumnDropdowns() {
            document.getElementById('detected-column-count').textContent = rawCsvHeader.length;

            const fnSelect = document.getElementById('map-first-name');
            const lnSelect = document.getElementById('map-last-name');
            const phoneSelect = document.getElementById('map-phone');
            const emailSelect = document.getElementById('map-email');

            // Reset options
            fnSelect.innerHTML = '<option value="">-- First / Full Name --</option>';
            lnSelect.innerHTML = '<option value="">-- Last Name (Optional) --</option>';
            phoneSelect.innerHTML = '<option value="">-- Select Phone Column --</option>';
            emailSelect.innerHTML = '<option value="">-- Select Email Column --</option>';

            rawCsvHeader.forEach((colName, idx) => {
                const opt = `<option value="${idx}">${colName}</option>`;
                fnSelect.innerHTML += opt;
                lnSelect.innerHTML += opt;
                phoneSelect.innerHTML += opt;
                emailSelect.innerHTML += opt;

                // Smart Auto-detection based on header names
                const lower = colName.toLowerCase();
                if (lower.includes('phone') || lower.includes('mobile') || lower.includes('cell')) {
                    phoneSelect.value = idx;
                } else if (lower.includes('first') || lower.includes('full name') || lower.includes('name')) {
                    if (!fnSelect.value) fnSelect.value = idx;
                } else if (lower.includes('last')) {
                    lnSelect.value = idx;
                } else if (lower.includes('email') || lower.includes('mail')) {
                    emailSelect.value = idx;
                }
            });
        }

        function processAndNormalizeData() {
            console.log('processAndNormalizeData');
            const fnIdx = document.getElementById('map-first-name').value;
            const lnIdx = document.getElementById('map-last-name').value;
            const phoneIdx = document.getElementById('map-phone').value;
            const emailIdx = document.getElementById('map-email').value;

            if (phoneIdx === "") {
                alert("Please select the column for Phone Number.");
                return;
            }

            contactMap.clear(); // Initialize fresh Map() with unique phone numbers

            rawCsvRows.forEach(row => {
                const rawPhone = row[phoneIdx] || '';
                const normalizedPhone = normalizePhone(rawPhone);

                if (!normalizedPhone) return; // Skip invalid phone entries

                // Normalize name
                let firstName = '';
                let lastName = '';

                if (fnIdx !== "") {
                    const rawFn = row[fnIdx] || '';
                    if (lnIdx !== "" && lnIdx !== fnIdx) {
                        firstName = rawFn.trim();
                        lastName = (row[lnIdx] || '').trim();
                    } else {
                        // Split full name if combined
                        const nameParts = rawFn.trim().split(/\s+/);
                        firstName = nameParts[0] || '';
                        lastName = nameParts.slice(1).join(' ') || '';
                    }
                }

                // Default fallback if name is empty
                if (!firstName) firstName = 'Friend';

                // Normalize email
                const rawEmail = emailIdx !== "" ? (row[emailIdx] || '') : '';
                const normalizedEmail = normalizeEmail(rawEmail);

                // Populate Map with unique phone as key
                if (!contactMap.has(normalizedPhone)) {
                    contactMap.set(normalizedPhone, {
                        phone: normalizedPhone,
                        rawPhone: rawPhone,
                        first_name: firstName,
                        last_name: lastName,
                        email: normalizedEmail,
                        sent: false
                    });
                }
            });

            if (contactMap.size === 0) {
                alert("No valid phone numbers found in the selected column.");
                return;
            }

            renderContactsList();
            goToStep(3);
        }

        function normalizePhone(phoneStr) {
            if (!phoneStr) return '';
            // Strip non-digits
            const digits = phoneStr.replace(/\D/g, '');
            if (digits.length < 10) return ''; // Invalid phone number length
            // Format standard 10 digit US number or keep international leading digits
            if (digits.length === 10) {
                return `+1${digits}`;
            } else if (digits.length === 11 && digits.startsWith('1')) {
                return `+${digits}`;
            }
            return `+${digits}`;
        }

        function normalizeEmail(emailStr) {
            if (!emailStr) return '';
            return emailStr.trim().toLowerCase();
        }

        function renderContactsList() {
            const listContainer = document.getElementById('contacts-list');
            listContainer.innerHTML = '';

            let totalCount = contactMap.size;
            let sentCount = 0;

            const searchQuery = (document.getElementById('contact-search').value || '').toLowerCase();

            contactMap.forEach((contact, phoneKey) => {
                if (contact.sent) sentCount++;

                // Apply Filters
                if (showUnsentOnly && contact.sent) return;

                const fullName = `${contact.first_name} ${contact.last_name}`.trim();
                if (searchQuery) {
                    const matchName = fullName.toLowerCase().includes(searchQuery);
                    const matchPhone = contact.phone.includes(searchQuery);
                    if (!matchName && !matchPhone) return;
                }

                // Create custom encoded SMS Message
                const messageText = MESSAGE_TEMPLATE.replace('{first_name}', contact.first_name);
                const smsUri = `sms:${contact.phone}?body=${encodeURIComponent(messageText)}`;

                const rowEl = document.createElement('div');
                rowEl.className = `contact-item ${contact.sent ? 'is-sent' : ''}`;

                rowEl.innerHTML = `
                    <div class="contact-details">
                        <div class="contact-header">
                            <span class="contact-name">${escapeHtml(fullName)}</span>
                            ${contact.sent ? `<span class="contact-badge">Sent</span>` : ''}
                        </div>
                        <div class="contact-phone">${escapeHtml(contact.phone)}</div>
                        ${contact.email ? `<div class="contact-email">${escapeHtml(contact.email)}</div>` : ''}
                    </div>

                    <!-- Action SMS Hyperlink Button -->
                    <a href="${smsUri}" 
                       onclick="markAsSent('${phoneKey}')" 
                       class="sms-btn ${contact.sent ? 'is-sent' : ''}">
                       ${contact.sent
                        ? `<svg class="sms-btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                              <span>Sent</span>`
                        : `<svg class="sms-btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                              <span>Text</span>`
                    }
                    </a>
                `;

                listContainer.appendChild(rowEl);
            });

            // Update Progress Bar & Text
            document.getElementById('progress-text').textContent = `${sentCount} / ${totalCount} Contacted`;
            const percentage = totalCount > 0 ? (sentCount / totalCount) * 100 : 0;
            document.getElementById('progress-bar').style.width = `${percentage}%`;
        }

        function markAsSent(phoneKey) {
            if (contactMap.has(phoneKey)) {
                const record = contactMap.get(phoneKey);
                record.sent = true;
                contactMap.set(phoneKey, record);

                // Re-render to update checkmarks and progress
                setTimeout(() => {
                    renderContactsList();
                }, 300);
            }
        }

        function filterContacts() {
            renderContactsList();
        }

        function toggleFilterSent() {
            showUnsentOnly = !showUnsentOnly;
            const btn = document.getElementById('btn-filter-sent');
            btn.textContent = showUnsentOnly ? 'Unsent' : 'All';
            btn.className = `filter-btn ${showUnsentOnly ? 'is-active' : ''}`;
            renderContactsList();
        }

        function resetProgress() {
            if (confirm("Reset all sent checkmarks back to uncontacted status?")) {
                contactMap.forEach((val, key) => {
                    val.sent = false;
                    contactMap.set(key, val);
                });
                renderContactsList();
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>

</body>
